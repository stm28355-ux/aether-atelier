<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Atelier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Aether Atelier <small>試作</small></h1>
  <nav id="tabs"></nav>
  <div class="speed">
    <button id="pause" title="Space">一時停止</button>
    <button data-speed="1" class="on">1倍</button>
    <button data-speed="2">2倍</button>
    <button data-speed="4">4倍</button>
  </div>
</header>
<main>
  <aside id="left">
    <h2>置く物</h2>
    <div id="palette"></div>
    <h2>操作</h2>
    <ul class="help">
      <li>左クリック：置く（ベルトはドラッグで引く）</li>
      <li>右クリック：壊す／持っている物を手放す</li>
      <li>R かホイール：向きを回す（置いた機械にも効く）</li>
      <li>Q：手放す　Space：一時停止</li>
      <li>壊す・置き直すは何度でもタダ</li>
    </ul>
    <button id="reset">この区画をやり直す</button>
    <button id="openall">（試作用）全部開く</button>
  </aside>
  <section id="center">
    <p id="intro"></p>
    <canvas id="board"></canvas>
    <p id="info">&nbsp;</p>
  </section>
  <aside id="right">
    <h2>依頼</h2>
    <div id="requests"></div>
    <h2>納めている量（毎分）</h2>
    <div id="rates"></div>
    <h2>素材</h2>
    <div id="legend"></div>
  </aside>
</main>
<div id="toast"></div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
